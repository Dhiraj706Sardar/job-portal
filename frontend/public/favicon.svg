<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    <linearGradient id="shineGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="8" y="10" width="48" height="46" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1E1B4B" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect width="64" height="64" rx="16" fill="url(#shineGrad)" />

  <!-- Briefcase Icon -->
  <g filter="url(#shadow)">
    <!-- Handle -->
    <path d="M25 21V18.5C25 17.1193 26.1193 16 27.5 16H36.5C37.8807 16 39 17.1193 39 18.5V21" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Main Briefcase Body -->
    <rect x="13" y="21" width="38" height="27" rx="5" fill="#FFFFFF" />

    <!-- Briefcase flap line -->
    <path d="M13 31.5H51" stroke="#E0E7FF" stroke-width="2" stroke-linecap="round" />
    
    <!-- Central Clasp / Lock -->
    <rect x="28.5" y="28.5" width="7" height="7" rx="2" fill="#4F46E5" />
    <circle cx="32" cy="32" r="1.2" fill="#FFFFFF" />
  </g>
</svg>
